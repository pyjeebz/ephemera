<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ephemera</title>
<style>
	:root { color-scheme: light dark; }
	body {
		font: 16px/1.5 system-ui, sans-serif;
		margin: 0; display: grid; place-items: center;
		min-height: 100vh;
	}
	main { max-width: 640px; padding: 2rem; text-align: center; }
	video { width: 100%; border-radius: 8px; margin-top: 1rem; }
	button.btn { cursor: pointer; border: none; font: inherit; }
	a.btn {
		display: inline-block; margin-top: 1rem; padding: .6rem 1.2rem;
		border-radius: 8px; background: #2563eb; color: #fff;
		text-decoration: none; font-weight: 600;
	}
	p.state { color: gray; font-style: italic; }
	h1 { font-size: 1.4rem; }
	details.report { margin-top: 2.5rem; color: gray; font-size: .9rem; }
	details.report summary { cursor: pointer; }
	details.report form { display: grid; gap: .5rem; margin-top: .75rem; text-align: left; }
	details.report select, details.report textarea, details.report button { font: inherit; }
	details.report button { justify-self: start; padding: .3rem .9rem; }
</style>
</head>
<body>
<main>
	<h1 id="name">Ephemera</h1>
	<p class="state" id="state">connecting…</p>
	<div id="hero"></div>
	<details class="report" id="report" hidden>
		<summary>Report this link</summary>
		<form id="report-form">
			<label>What's wrong with it?
				<select name="reason" required>
					<option value="">Choose a reason</option>
					<option value="illegal">Illegal content (including child sexual abuse)</option>
					<option value="copyright">Copyright infringement</option>
					<option value="malware">Malware or phishing</option>
					<option value="harassment">Harassment or abuse</option>
					<option value="other">Something else</option>
				</select>
			</label>
			<label>Anything the relay operator should know? (optional)
				<textarea name="note" rows="3" maxlength="1000"></textarea>
			</label>
			<button type="submit">Send report</button>
			<p id="report-msg" role="status"></p>
		</form>
	</details>
</main>
<script>
(() => {
	const id = location.pathname.split("/").filter(Boolean)[0] || "";
	const $ = (s) => document.querySelector(s);
	const nameEl = $("#name"), stateEl = $("#state"), heroEl = $("#hero");

	const STREAMABLE = ["video/mp4", "video/webm", "video/quicktime", "audio/mpeg", "audio/mp4", "audio/wav"];

	let hero = ""; // "video" | "download" | ""
	let countdownTimer = null;

	function render(st) {
		if (st.name) nameEl.textContent = st.name;

		// clear any countdown from the previous render
		if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }

		switch (st.state) {
		case "live":
		case "available": {
			// live: streams from the sender (and maybe uploading);
			// available: the whole file is on the relay
			const where = st.state === "available"
				? "ready to watch, even with the sender offline"
				: "streams live from the sender's device" +
					(st.upload && st.size ? ` · ${Math.floor(100 * (st.uploaded || 0) / st.size)}% uploaded` : "");
			if (st.expires) {
				const tick = () => {
					const left = st.expires - Date.now()/1000;
					if (left <= 0) { pollNow(); return; }
					const h = Math.floor(left/3600), m = Math.floor(left%3600/60), s = Math.floor(left%60);
					stateEl.textContent = `${where} · link expires in ${h}h ${m}m ${s}s`;
				};
				tick();
				countdownTimer = setInterval(tick, 1000);
			} else {
				stateEl.textContent = where;
			}
			if (!hero && STREAMABLE.includes(st.mime)) {
				hero = "video";
				const v = document.createElement("video");
				v.controls = true;
				watch(v);
				v.src = `/${id}/file`;
				v.onerror = () => { hero = "download"; render(st); };
				heroEl.replaceChildren(v);
			} else if (!hero) {
				hero = "download";
				renderDownload(st);
			}
			break;
		}
		case "offline":
			hero = "";
			heroEl.replaceChildren();
			if (st.replay) {
				stateEl.textContent = "The sender is offline, but the parts you already watched replay from memory.";
				renderReplayDownload(st);
			} else if (st.prefix > 0) {
				const mb = (st.prefix / 1048576).toFixed(0);
				stateEl.textContent = `The sender is offline, but the first ${mb} MB is here. Start watching; the rest streams when they're back.`;
				renderPrefixPlayer(st);
			} else {
				stateEl.textContent = "This link streams live from the sender's device. It'll return when the sender is back online.";
				renderNotify();
			}
			break;
		case "expired":
			hero = "";
			heroEl.replaceChildren();
			stateEl.textContent = "This link has expired. Ephemera links leave no trace.";
			return; // stop polling
		default:
			hero = "";
			stateEl.textContent = "This link doesn't exist (or you typo'd it).";
			return; // 404: stop polling
		}
	}

	function renderNotify() {
		const btn = document.createElement("button");
		btn.textContent = "Ping me when it's back";
		btn.className = "btn";
		btn.style.background = "#9ca3af";
		btn.onclick = () => {
			btn.textContent = "Will do — leave this tab open";
			btn.disabled = true;
			pollFast = true; // poll every 1s until back
		};
		heroEl.replaceChildren(btn);
	}

	function renderReplayDownload(st) {
		const a = document.createElement("a");
		a.className = "btn";
		a.href = `/${id}/file`;
		a.download = (st.name || id) + " (replay)";
		a.textContent = "Replay what's cached";
		heroEl.replaceChildren(a);
	}

	function renderPrefixPlayer(st) {
		if (STREAMABLE.includes(st.mime)) {
			const v = document.createElement("video");
			v.controls = true;
			watch(v);
			v.src = `/${id}/file`;
			heroEl.replaceChildren(v);
			return;
		}
		const a = document.createElement("a");
		a.className = "btn";
		a.href = `/${id}/file`;
		a.download = st.name || id;
		a.textContent = "Download the cached start";
		heroEl.replaceChildren(a);
	}

	function renderDownload(st) {
		const a = document.createElement("a");
		a.className = "btn";
		a.href = `/${id}/file`;
		a.download = st.name || id;
		a.textContent = "Download";
		heroEl.replaceChildren(a);
	}

	let pollFast = false;

	// Playback report: how watching went on this page, sent to the
	// relay when the page is hidden or closed. Numbers only: how long
	// the first frame took, how soon playing started after pressing
	// play, how often and how long playback waited for data, how long
	// seeks took. The relay adds what it measured of the sender; it
	// never sees who you are.
	const pb = {
		view: (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2)).replace(/-/g, "").slice(0, 32),
		state: "", ttff_ms: 0, start_ms: 0, stalls: 0, stall_ms: 0, seeks: 0, seek_wait_ms: 0, watched_s: 0, duration_s: 0,
	};
	let pbVideo = null, loadAt = 0, playAt = 0, waitAt = 0, seekAt = 0, pbSent = "";
	const now = () => performance.now();
	function endWait() {
		if (waitAt) { pb.stall_ms += Math.round(now() - waitAt); waitAt = 0; }
	}
	// watch is called before the video's src is set, so loadAt is
	// when it started loading
	function watch(v) {
		pbVideo = v;
		if (!loadAt) { loadAt = now(); pb.state = lastState; }
		v.addEventListener("loadeddata", () => {
			if (!pb.ttff_ms) pb.ttff_ms = Math.max(1, Math.round(now() - loadAt));
		});
		v.addEventListener("play", () => {
			if (!playAt) playAt = now();
		});
		v.addEventListener("playing", () => {
			if (playAt && !pb.start_ms) pb.start_ms = Math.max(1, Math.round(now() - playAt));
			endWait();
		});
		v.addEventListener("waiting", () => {
			// a wait for data mid-play; waits right after a seek are
			// counted as seek time instead
			if (pb.start_ms && !v.seeking && !waitAt) { pb.stalls++; waitAt = now(); }
		});
		v.addEventListener("pause", endWait);
		v.addEventListener("seeking", () => {
			endWait();
			if (pb.start_ms) { pb.seeks++; seekAt = now(); }
		});
		v.addEventListener("seeked", () => {
			if (seekAt) { pb.seek_wait_ms += Math.round(now() - seekAt); seekAt = 0; }
		});
	}
	function sendPlayback() {
		if (!pb.ttff_ms || !pbVideo) return; // never got to a first frame
		endWait();
		let watched = 0;
		for (let i = 0; i < pbVideo.played.length; i++) watched += pbVideo.played.end(i) - pbVideo.played.start(i);
		pb.watched_s = Math.round(watched * 10) / 10;
		pb.duration_s = isFinite(pbVideo.duration) ? Math.round(pbVideo.duration * 10) / 10 : 0;
		const json = JSON.stringify(pb);
		if (json === pbSent) return; // hidden and closed: one report
		pbSent = json;
		const body = new Blob([json], {type: "application/json"});
		if (!navigator.sendBeacon || !navigator.sendBeacon(`/${id}/playback`, body)) {
			fetch(`/${id}/playback`, {method: "POST", body, keepalive: true}).catch(() => {});
		}
	}
	addEventListener("pagehide", sendPlayback);
	document.addEventListener("visibilitychange", () => {
		if (document.visibilityState === "hidden") sendPlayback();
	});

	async function poll() {
		try {
			const resp = await fetch(`/${id}/status`);
			if (resp.status === 410) { reportEl.hidden = true; render({state: "expired"}); return false; }
			if (resp.status === 404) { reportEl.hidden = true; render({state: "gone"}); return false; }
			const wasOffline = lastState === "offline";
			const st = await resp.json();
			lastState = st.state;
			render(st);
			reportEl.hidden = false;
			if (wasOffline && st.state !== "offline") pollFast = false; // back: normal cadence
			return st.state !== "expired" && st.state !== "gone";
		} catch {
			return true; // network blip: keep polling
		}
	}

	async function pollNow() { await poll(); }

	let lastState = "";

	// reporting: offered once the link exists (live or offline)
	const reportEl = $("#report"), reportForm = $("#report-form"), reportMsg = $("#report-msg");
	reportForm.onsubmit = async (e) => {
		e.preventDefault();
		const data = new FormData(reportForm);
		const btn = reportForm.querySelector("button");
		btn.disabled = true;
		try {
			const resp = await fetch(`/${id}/report`, {
				method: "POST",
				headers: {"Content-Type": "application/json"},
				body: JSON.stringify({reason: data.get("reason"), note: data.get("note")}),
			});
			if (resp.ok) {
				reportForm.replaceChildren(Object.assign(document.createElement("p"), {
					textContent: "Thanks. The relay operator will review this link.",
				}));
				return;
			}
			const body = await resp.json().catch(() => ({}));
			reportMsg.textContent = resp.status === 429
				? "Too many reports from here. Try again later."
				: (body.error || "The report didn't go through.");
		} catch {
			reportMsg.textContent = "The report didn't go through. Check your connection.";
		}
		btn.disabled = false;
	};

	(async () => {
		while (await poll()) {
			await new Promise(r => setTimeout(r, pollFast ? 1000 : 5000));
		}
	})();
})();
</script>
</body>
</html>
