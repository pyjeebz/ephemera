<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ephemera</title>
<style>
	:root { color-scheme: light dark; }
	body {
		font: 16px/1.5 system-ui, sans-serif;
		margin: 0; display: grid; place-items: center;
		min-height: 100vh;
	}
	main { max-width: 640px; padding: 2rem; text-align: center; }
	video { width: 100%; border-radius: 8px; margin-top: 1rem; }
	button.btn { cursor: pointer; border: none; font: inherit; }
	a.btn {
		display: inline-block; margin-top: 1rem; padding: .6rem 1.2rem;
		border-radius: 8px; background: #2563eb; color: #fff;
		text-decoration: none; font-weight: 600;
	}
	p.state { color: gray; font-style: italic; }
	h1 { font-size: 1.4rem; }
</style>
</head>
<body>
<main>
	<h1 id="name">Ephemera</h1>
	<p class="state" id="state">connecting…</p>
	<div id="hero"></div>
</main>
<script>
(() => {
	const id = location.pathname.split("/").filter(Boolean)[0] || "";
	const $ = (s) => document.querySelector(s);
	const nameEl = $("#name"), stateEl = $("#state"), heroEl = $("#hero");

	const STREAMABLE = ["video/mp4", "video/webm", "video/quicktime", "audio/mpeg", "audio/mp4", "audio/wav"];

	let hero = ""; // "video" | "download" | ""
	let countdownTimer = null;

	function render(st) {
		if (st.name) nameEl.textContent = st.name;

		// clear any countdown from the previous render
		if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }

		switch (st.state) {
		case "live":
			if (st.expires) {
				const tick = () => {
					const left = st.expires - Date.now()/1000;
					if (left <= 0) { pollNow(); return; }
					const h = Math.floor(left/3600), m = Math.floor(left%3600/60), s = Math.floor(left%60);
					stateEl.textContent = `streams live from the sender's device · link expires in ${h}h ${m}m ${s}s`;
				};
				tick();
				countdownTimer = setInterval(tick, 1000);
			} else {
				stateEl.textContent = "streams live from the sender's device";
			}
			if (!hero && STREAMABLE.includes(st.mime)) {
				hero = "video";
				const v = document.createElement("video");
				v.controls = true;
				v.src = `/${id}/file`;
				v.onerror = () => { hero = "download"; render(st); };
				heroEl.replaceChildren(v);
			} else if (!hero) {
				hero = "download";
				renderDownload(st);
			}
			break;
		case "offline":
			hero = "";
			heroEl.replaceChildren();
			if (st.replay) {
				stateEl.textContent = "The sender is offline, but the parts you already watched replay from memory.";
				renderReplayDownload(st);
			} else if (st.prefix > 0) {
				const mb = (st.prefix / 1048576).toFixed(0);
				stateEl.textContent = `The sender is offline, but the first ${mb} MB is here. Start watching; the rest streams when they're back.`;
				renderPrefixPlayer(st);
			} else {
				stateEl.textContent = "This link streams live from the sender's device. It'll return when the sender is back online.";
				renderNotify();
			}
			break;
		case "expired":
			hero = "";
			heroEl.replaceChildren();
			stateEl.textContent = "This link has expired. Ephemera links leave no trace.";
			return; // stop polling
		default:
			hero = "";
			stateEl.textContent = "This link doesn't exist (or you typo'd it).";
			return; // 404: stop polling
		}
	}

	function renderNotify() {
		const btn = document.createElement("button");
		btn.textContent = "Ping me when it's back";
		btn.className = "btn";
		btn.style.background = "#9ca3af";
		btn.onclick = () => {
			btn.textContent = "Will do — leave this tab open";
			btn.disabled = true;
			pollFast = true; // poll every 1s until back
		};
		heroEl.replaceChildren(btn);
	}

	function renderReplayDownload(st) {
		const a = document.createElement("a");
		a.className = "btn";
		a.href = `/${id}/file`;
		a.download = (st.name || id) + " (replay)";
		a.textContent = "Replay what's cached";
		heroEl.replaceChildren(a);
	}

	function renderPrefixPlayer(st) {
		if (STREAMABLE.includes(st.mime)) {
			const v = document.createElement("video");
			v.controls = true;
			v.src = `/${id}/file`;
			heroEl.replaceChildren(v);
			return;
		}
		const a = document.createElement("a");
		a.className = "btn";
		a.href = `/${id}/file`;
		a.download = st.name || id;
		a.textContent = "Download the cached start";
		heroEl.replaceChildren(a);
	}

	function renderDownload(st) {
		const a = document.createElement("a");
		a.className = "btn";
		a.href = `/${id}/file`;
		a.download = st.name || id;
		a.textContent = "Download";
		heroEl.replaceChildren(a);
	}

	let pollFast = false;

	async function poll() {
		try {
			const resp = await fetch(`/${id}/status`);
			if (resp.status === 410) { render({state: "expired"}); return false; }
			if (resp.status === 404) { render({state: "gone"}); return false; }
			const wasOffline = lastState === "offline";
			const st = await resp.json();
			lastState = st.state;
			render(st);
			if (wasOffline && st.state === "live") pollFast = false; // back: normal cadence
			return st.state !== "expired" && st.state !== "gone";
		} catch {
			return true; // network blip: keep polling
		}
	}

	async function pollNow() { await poll(); }

	let lastState = "";

	(async () => {
		while (await poll()) {
			await new Promise(r => setTimeout(r, pollFast ? 1000 : 5000));
		}
	})();
})();
</script>
</body>
</html>
