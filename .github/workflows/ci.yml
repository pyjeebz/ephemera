name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Shell scripts
        run: |
          shellcheck -s sh install.sh
          shellcheck deploy/host/*.sh deploy/guest/*.sh deploy/release/*.sh
      - name: Release build
        run: deploy/release/build.sh v0.0.0-ci dist
