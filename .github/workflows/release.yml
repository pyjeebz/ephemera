name: release

# Publishes a GitHub release for vX.Y.Z, with that version's section of
# CHANGELOG.md as its notes. Start it either way:
#   - push a tag vX.Y.Z, or
#   - run this workflow by hand with a version; it tags the commit it ran on.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. v0.1.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Check the version
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "not a version: $VERSION"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "$VERSION is already tagged"; exit 1
          fi
      - name: Test
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
      - name: Build
        run: deploy/release/build.sh "$VERSION" dist
      - name: Notes
        run: |
          awk -v v="$VERSION" '
            /^## v/ { on = ($2 == v) ; next }
            on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--title "$VERSION" --notes-file notes.md)
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            flags+=(--target "$GITHUB_SHA")
          else
            flags+=(--verify-tag)
          fi
          gh release create "$VERSION" dist/* "${flags[@]}"
