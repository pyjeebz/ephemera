# The hosted central server, api.ephemera.run. Deploy from the repository
# root, always with --ha=false: the server keeps its hosts' connections in
# memory, so it runs as exactly one machine.
#
#   fly deploy --config deploy/fly/fly.toml --ha=false
#
# Secrets, set with fly secrets set (never in this file):
#   EPHEMERA_DATABASE_URL          the Neon database, direct (not -pooler)
#   EPHEMERA_GITHUB_CLIENT_ID      the GitHub OAuth app
#   EPHEMERA_GITHUB_CLIENT_SECRET

app = "ephemera-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  EPHEMERA_PUBLIC_URL = "https://api.ephemera.run"
  EPHEMERA_DASHBOARD_URL = "https://ephemera.run/dashboard"

[http_service]
  internal_port = 7700
  force_https = true
  # Hosts hold a connection open, so the machine must never stop for idling.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
